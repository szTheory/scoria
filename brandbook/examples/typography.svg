<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" role="img" aria-labelledby="title desc">
  <title id="title">Scoria typography specimen</title>
  <desc id="desc">IBM Plex Sans weight ramp and JetBrains Mono code line rendering brand text across the type scale.</desc>
  <rect width="960" height="520" fill="#11100f"/>
  <text x="48" y="56" fill="#fff9f3" font-family="'IBM Plex Sans', ui-sans-serif, system-ui, sans-serif" font-size="28" font-weight="600">Type system</text>
  <text x="48" y="82" fill="#88786d" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="11" letter-spacing="2">IBM PLEX SANS · JETBRAINS MONO · SYSTEM-FALLBACK STACKS</text>
  <g font-family="'IBM Plex Sans', ui-sans-serif, system-ui, sans-serif" fill="#faf5ef">
    <text x="48" y="150" font-size="48" font-weight="700" fill="#fff9f3">Trace the run.</text>
    <text x="48" y="196" font-size="36" font-weight="600">Prove the change.</text>
    <text x="48" y="236" font-size="24" font-weight="500" fill="#bdaea3">Ship the agent.</text>
  </g>
  <g font-family="'IBM Plex Sans', ui-sans-serif, system-ui, sans-serif">
    <text x="48" y="290" font-size="13" fill="#88786d">Regular 400</text>
    <text x="200" y="290" font-size="20" fill="#faf5ef">AI ops for Phoenix apps.</text>
    <text x="48" y="324" font-size="13" fill="#88786d">SemiBold 600</text>
    <text x="200" y="324" font-size="20" font-weight="600" fill="#faf5ef">AI ops for Phoenix apps.</text>
    <text x="48" y="358" font-size="13" fill="#88786d">Bold 700</text>
    <text x="200" y="358" font-size="20" font-weight="700" fill="#fff9f3">AI ops for Phoenix apps.</text>
  </g>
  <rect x="48" y="386" width="864" height="100" rx="8" fill="#0c0b0a" stroke="#3a332f"/>
  <text x="64" y="416" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="13" fill="#88786d">JetBrains Mono 13px — trace IDs, model IDs, code</text>
  <text x="64" y="448" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="14"><tspan fill="#7dd8d1">{:ok, run}</tspan><tspan fill="#faf5ef"> = </tspan><tspan fill="#faf5ef">Scoria.</tspan><tspan fill="#ff7a4d">run</tspan><tspan fill="#faf5ef">(SupportAgent, </tspan><tspan fill="#7dd8d1">input:</tspan><tspan fill="#f8d6c8"> "refund A123"</tspan><tspan fill="#faf5ef">)</tspan></text>
  <text x="64" y="472" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="13" fill="#88786d">trc_8f2a · gpt-4o · 1,284 tok · 842ms</text>
</svg>
