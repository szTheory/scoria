<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Docs page mock</title>
  <desc id="desc">A HexDocs-ish light-mode page: sidebar with mark, content column, and a brand-token code block.</desc>
  <rect width="1200" height="760" fill="#faf5ef"/>
  <!-- Sidebar -->
  <rect width="280" height="760" fill="#fff9f3"/>
  <line x1="280" y1="0" x2="280" y2="760" stroke="#cdbbac"/>
  <g transform="translate(32 36) scale(0.34)">
    <path fill="#b94f31" fill-rule="evenodd" d="M0,-51.98L35.48,-36.24Q41.88,-33.4,42.43,-26.42L44.79,3.37Q45.34,10.35,40.4,15.31L23.06,32.67Q18.12,37.63,11.17,38.44L-13.32,41.28Q-20.27,42.09,-25.37,37.29L-47.22,16.74Q-52.32,11.94,-50.51,5.18L-42.31,-25.54Q-40.5,-32.3,-34.2,-35.36ZM-3,-22C-3,-29.18,-8.82,-35,-16,-35C-23.18,-35,-29,-29.18,-29,-22C-29,-14.82,-23.18,-9,-16,-9C-8.82,-9,-3,-14.82,-3,-22ZM10.5,-2C10.5,-6.69,6.69,-10.5,2,-10.5C-2.69,-10.5,-6.5,-6.69,-6.5,-2C-6.5,2.69,-2.69,6.5,2,6.5C6.69,6.5,10.5,2.69,10.5,-2ZM22,16C22,12.69,19.31,10,16,10C12.69,10,10,12.69,10,16C10,19.31,12.69,22,16,22C19.31,22,22,19.31,22,16ZM10,30C10,27.79,8.21,26,6,26C3.79,26,2,27.79,2,30C2,32.21,3.79,34,6,34C8.21,34,10,32.21,10,30Z"/>
  </g>
  <text x="76" y="58" fill="#11100f" font-family="'IBM Plex Sans', ui-sans-serif, system-ui, sans-serif" font-size="20" font-weight="600">Scoria</text>
  <g font-family="'IBM Plex Sans', ui-sans-serif, system-ui, sans-serif" font-size="15">
    <rect x="16" y="110" width="248" height="34" rx="6" fill="#f8d6c8"/>
    <text x="36" y="133" fill="#b94f31" font-weight="600">Getting started</text>
    <text x="36" y="178" fill="#3a332f">Trace Explorer</text>
    <text x="36" y="216" fill="#3a332f">Eval Workbench</text>
    <text x="36" y="254" fill="#3a332f">Prompt Registry</text>
    <text x="36" y="292" fill="#3a332f">Tool Governance</text>
    <text x="36" y="330" fill="#3a332f">MCP Gateway</text>
  </g>
  <!-- Content column -->
  <text x="340" y="80" fill="#11100f" font-family="'IBM Plex Sans', ui-sans-serif, system-ui, sans-serif" font-size="34" font-weight="700">Getting started</text>
  <text x="340" y="124" fill="#3a332f" font-family="'IBM Plex Sans', ui-sans-serif, system-ui, sans-serif" font-size="17">Add Scoria to your Phoenix app. It records every run as a structured,</text>
  <text x="340" y="150" fill="#3a332f" font-family="'IBM Plex Sans', ui-sans-serif, system-ui, sans-serif" font-size="17">queryable trace and mounts a LiveView operator UI.</text>
  <text x="340" y="206" fill="#11100f" font-family="'IBM Plex Sans', ui-sans-serif, system-ui, sans-serif" font-size="22" font-weight="600">Installation</text>
  <!-- Code block in brand tokens (light: sunken #f1e8de ground) -->
  <rect x="340" y="232" width="800" height="120" rx="8" fill="#0c0b0a" stroke="#3a332f"/>
  <g font-family="'JetBrains Mono', ui-monospace, monospace" font-size="14">
    <text x="364" y="266" fill="#88786d"># mix.exs</text>
    <text x="364" y="296"><tspan fill="#faf5ef">{</tspan><tspan fill="#7dd8d1">:scoria</tspan><tspan fill="#faf5ef">, </tspan><tspan fill="#f8d6c8">"~&gt; 0.2"</tspan><tspan fill="#faf5ef">}</tspan></text>
    <text x="364" y="328"><tspan fill="#e65a32">$</tspan><tspan fill="#faf5ef"> mix scoria.install</tspan></text>
  </g>
  <text x="340" y="410" fill="#11100f" font-family="'IBM Plex Sans', ui-sans-serif, system-ui, sans-serif" font-size="22" font-weight="600">Your first run</text>
  <rect x="340" y="436" width="800" height="150" rx="8" fill="#0c0b0a" stroke="#3a332f"/>
  <g font-family="'JetBrains Mono', ui-monospace, monospace" font-size="14">
    <text x="364" y="470"><tspan fill="#7dd8d1">{:ok, run}</tspan><tspan fill="#faf5ef"> =</tspan></text>
    <text x="384" y="498"><tspan fill="#faf5ef">Scoria.</tspan><tspan fill="#ff7a4d">run</tspan><tspan fill="#faf5ef">(MyApp.AI.SupportAgent,</tspan></text>
    <text x="404" y="526"><tspan fill="#7dd8d1">input:</tspan><tspan fill="#f8d6c8"> "Can I get a refund for A123?"</tspan><tspan fill="#faf5ef">,</tspan></text>
    <text x="404" y="554"><tspan fill="#7dd8d1">actor:</tspan><tspan fill="#faf5ef"> current_user</tspan></text>
    <text x="384" y="582" fill="#faf5ef">)</text>
  </g>
</svg>
