name: CI Verify

on:
  workflow_call:

permissions:
  contents: read

# Reusable CI SSOT: policy → build → { test, ratchet, knowledge, connector, full-suite } → verify-summary.
# Consumed by ci.yml, release-please verify, and hex-publish recovery workflows.
# Maintainer narrative: docs/MAINTAINERS.md — CI gate map + flake policy.
# Executable order SSOT: Scoria.VerificationLanes + test/scoria/ci_policy_contract_test.exs.

jobs:
  # policy: baseline expiry + compile WAE + lane-contract tests (no Postgres)
  policy:
    runs-on: ubuntu-latest
    env:
      MIX_ENV: test

    steps:
      - uses: actions/checkout@v6

      - name: Install Erlang and Elixir
        id: beam
        uses: erlef/setup-beam@v1
        with:
          version-file: .tool-versions
          version-type: strict

      - name: Restore deps cache
        uses: actions/cache@v5
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-${{ steps.beam.outputs.otp-version }}-${{ steps.beam.outputs.elixir-version }}-test-mix-${{ hashFiles('**/mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ steps.beam.outputs.otp-version }}-${{ steps.beam.outputs.elixir-version }}-test-mix-

      - name: Install dependencies
        run: mix deps.get

      - name: Check warning baseline expiry
        run: mix scoria.warning_baseline.check

      - name: Check committed warning inventory baseline
        run: mix scoria.warning_inventory.check_baseline

      - name: Compile with warnings as errors
        run: mix compile --warnings-as-errors

      - name: Verify lane-contract tests with warnings as errors
        env:
          SCORIA_LANE_CONTRACT_ONLY: "true"
        run: mix test --no-start --warnings-as-errors test/scoria/ci_policy_contract_test.exs test/scoria/verification_lanes_test.exs test/scoria/adoption_surface_test.exs

  # build: compile once (MIX_ENV=test, WAE) and share artifact to downstream jobs
  build:
    runs-on: ubuntu-latest
    needs: policy
    env:
      MIX_ENV: test

    steps:
      - uses: actions/checkout@v6

      - name: Install Erlang and Elixir
        id: beam
        uses: erlef/setup-beam@v1
        with:
          version-file: .tool-versions
          version-type: strict

      - name: Restore deps + build cache
        uses: actions/cache@v5
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-${{ steps.beam.outputs.otp-version }}-${{ steps.beam.outputs.elixir-version }}-test-mix-${{ hashFiles('**/mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ steps.beam.outputs.otp-version }}-${{ steps.beam.outputs.elixir-version }}-test-mix-

      - name: Install dependencies
        run: mix deps.get

      - name: Compile with warnings as errors
        run: mix compile --warnings-as-errors

      - name: Pack compiled artifact (preserves mtimes)
        run: tar -czf build-test-env.tar.gz _build/test deps

      - name: Upload compiled artifact
        uses: actions/upload-artifact@v7
        with:
          name: build-test-env
          path: build-test-env.tar.gz
          retention-days: 1
          if-no-files-found: error

  # test: release_preview → closeout lanes → semantic (full-suite WAE moved to full-suite: matrix job)
  test:
    runs-on: ubuntu-latest
    needs: build

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: scoria_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d scoria_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      MIX_ENV: test
      SCORIA_DB_HOST: localhost
      SCORIA_DB_PORT: 5432
      SCORIA_DB_USERNAME: postgres
      SCORIA_DB_PASSWORD: postgres
      SCORIA_DB_NAME: scoria_test
      SCORIA_HEX_UNPACK_ROOT: tmp/scoria-release-preview

    steps:
      - uses: actions/checkout@v6

      - name: Install Erlang and Elixir
        id: beam
        uses: erlef/setup-beam@v1
        with:
          version-file: .tool-versions
          version-type: strict

      - name: Download compiled artifact
        uses: actions/download-artifact@v7
        with:
          name: build-test-env

      - name: Unpack compiled artifact (restores exact mtimes)
        run: tar -xzf build-test-env.tar.gz

      - name: Install dependencies (no-op when deps/ complete)
        run: mix deps.get

      - name: Run release preview lane
        run: MIX_ENV=dev mix scoria.release_preview

      - name: Install phx_new archive for host consumer proof
        run: mix archive.install hex phx_new --force

      # DB-prep: keep in sync with sibling parallel jobs
      - name: Prepare database
        run: |
          mix ecto.create
          mix ecto.migrate --to 20260511000300
          mix eval 'Scoria.TestSupport.Migrations.migrate_knowledge!()'
          mix ecto.migrate

      - name: Run adoption closure lane
        run: mix test.adoption

      - name: Upload host proof failure snapshot
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: scoria-host-proof-last-failure
          path: tmp/scoria-host-proof-last-failure/
          retention-days: 7
          if-no-files-found: ignore

      - name: Run runtime-to-handoff proof lane
        run: mix test.runtime_to_handoff

      - name: Run semantic fast-path lane
        run: mix test.semantic_fast_path --warnings-as-errors

  # ratchet: warning ratchet hygiene + WARN-06 compile-only parity guard.
  # Needs Postgres: `mix test` boots Scoria.Application (Oban.verify_migrated!/1 → DB) for
  # both tmp_preflight_test.exs and capture_parity_test.exs. DB-prep mirrors the sibling lanes.
  ratchet:
    runs-on: ubuntu-latest
    needs: build

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: scoria_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d scoria_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      MIX_ENV: test
      SCORIA_DB_HOST: localhost
      SCORIA_DB_PORT: 5432
      SCORIA_DB_USERNAME: postgres
      SCORIA_DB_PASSWORD: postgres
      SCORIA_DB_NAME: scoria_test

    steps:
      - uses: actions/checkout@v6

      - name: Install Erlang and Elixir
        id: beam
        uses: erlef/setup-beam@v1
        with:
          version-file: .tool-versions
          version-type: strict

      - name: Download compiled artifact
        uses: actions/download-artifact@v7
        with:
          name: build-test-env

      - name: Unpack compiled artifact (restores exact mtimes)
        run: tar -xzf build-test-env.tar.gz

      - name: Install dependencies (no-op when deps/ complete)
        run: mix deps.get

      # DB-prep: keep in sync with sibling parallel jobs
      - name: Prepare database
        run: |
          mix ecto.create
          mix ecto.migrate --to 20260511000300
          mix eval 'Scoria.TestSupport.Migrations.migrate_knowledge!()'
          mix ecto.migrate

      - name: Verify maintainer ratchet hygiene chain
        run: MIX_ENV=test mix test --warnings-as-errors test/scoria/warning_inventory/tmp_preflight_test.exs

      # WARN-06 parity guard: own `mix test` invocation (NOT the sharded full-suite) so the
      # nested `compile --force` subprocess runs in isolation, matching the passing local run.
      - name: Verify WARN-06 compile-only capture parity
        run: MIX_ENV=test mix test --include ratchet_parity test/scoria/warning_inventory/capture_parity_test.exs

  # knowledge: knowledge lane WAE (Postgres, full DB-prep)
  knowledge:
    runs-on: ubuntu-latest
    needs: build

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: scoria_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d scoria_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      MIX_ENV: test
      SCORIA_DB_HOST: localhost
      SCORIA_DB_PORT: 5432
      SCORIA_DB_USERNAME: postgres
      SCORIA_DB_PASSWORD: postgres
      SCORIA_DB_NAME: scoria_test

    steps:
      - uses: actions/checkout@v6

      - name: Install Erlang and Elixir
        id: beam
        uses: erlef/setup-beam@v1
        with:
          version-file: .tool-versions
          version-type: strict

      - name: Download compiled artifact
        uses: actions/download-artifact@v7
        with:
          name: build-test-env

      - name: Unpack compiled artifact (restores exact mtimes)
        run: tar -xzf build-test-env.tar.gz

      - name: Install dependencies (no-op when deps/ complete)
        run: mix deps.get

      # DB-prep: keep in sync with sibling parallel jobs
      - name: Prepare database
        run: |
          mix ecto.create
          mix ecto.migrate --to 20260511000300
          mix eval 'Scoria.TestSupport.Migrations.migrate_knowledge!()'
          mix ecto.migrate

      - name: Run knowledge lane
        run: mix test.knowledge --warnings-as-errors

  # connector: connector lane WAE + advisory gallery tail step (Postgres, full DB-prep)
  connector:
    runs-on: ubuntu-latest
    needs: build

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: scoria_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d scoria_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      MIX_ENV: test
      SCORIA_DB_HOST: localhost
      SCORIA_DB_PORT: 5432
      SCORIA_DB_USERNAME: postgres
      SCORIA_DB_PASSWORD: postgres
      SCORIA_DB_NAME: scoria_test

    steps:
      - uses: actions/checkout@v6

      - name: Install Erlang and Elixir
        id: beam
        uses: erlef/setup-beam@v1
        with:
          version-file: .tool-versions
          version-type: strict

      - name: Download compiled artifact
        uses: actions/download-artifact@v7
        with:
          name: build-test-env

      - name: Unpack compiled artifact (restores exact mtimes)
        run: tar -xzf build-test-env.tar.gz

      - name: Install dependencies (no-op when deps/ complete)
        run: mix deps.get

      # DB-prep: keep in sync with sibling parallel jobs
      - name: Prepare database
        run: |
          mix ecto.create
          mix ecto.migrate --to 20260511000300
          mix eval 'Scoria.TestSupport.Migrations.migrate_knowledge!()'
          mix ecto.migrate

      - name: Run connector lane
        run: mix test.connector --warnings-as-errors

      - name: Run support copilot gallery lane (advisory)
        run: mix scoria.test.support_copilot

  # full-suite: sharded full ExUnit suite (WAE) — 4-way matrix on shared build artifact
  full-suite:
    name: "full-suite (${{ matrix.partition }}/${{ strategy.job-total }})"
    runs-on: ubuntu-latest
    needs: build

    strategy:
      fail-fast: false
      matrix:
        partition: [1, 2, 3, 4]

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: scoria_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      MIX_ENV: test
      SCORIA_DB_HOST: localhost
      SCORIA_DB_PORT: 5432
      SCORIA_DB_USERNAME: postgres
      SCORIA_DB_PASSWORD: postgres
      MIX_TEST_PARTITION: ${{ matrix.partition }}

    steps:
      - uses: actions/checkout@v6

      - name: Install Erlang and Elixir
        id: beam
        uses: erlef/setup-beam@v1
        with:
          version-file: .tool-versions
          version-type: strict

      - name: Download compiled artifact
        uses: actions/download-artifact@v7
        with:
          name: build-test-env

      - name: Unpack compiled artifact (restores exact mtimes)
        run: tar -xzf build-test-env.tar.gz

      - name: Install dependencies (no-op when deps/ complete)
        run: mix deps.get

      # host_app_consumer_proof_test.exs / host_app_upgrade_proof_test.exs (:host_proof /
      # :host_upgrade) shell out to `mix phx.new`; the archive must be installed in this lane.
      - name: Install phx_new archive for host proof tests
        run: mix archive.install hex phx_new --force

      # DB-prep: keep in sync with sibling parallel jobs
      - name: Prepare database
        run: |
          mix ecto.create
          mix ecto.migrate --to 20260511000300
          mix eval 'Scoria.TestSupport.Migrations.migrate_knowledge!()'
          mix ecto.migrate

      # `ratchet_parity` runs in the dedicated ratchet lane (its nested `compile --force`
      # subprocess is incompatible with the sharded full-suite) — exclude it here.
      - name: Run full suite (shard ${{ matrix.partition }}/4)
        run: mix test --warnings-as-errors --partitions 4 --exclude ratchet_parity

  # verify-summary: name-agnostic fan-in; skipped = fail
  verify-summary:
    runs-on: ubuntu-latest
    needs: [policy, build, test, ratchet, knowledge, connector, full-suite]
    if: always()
    steps:
      - name: Assert all parallel verify lanes succeeded
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          set -euo pipefail
          for result in $RESULTS; do
            if [[ "$result" != "success" ]]; then
              echo "verify-summary failed: a parallel lane result was $result"
              exit 1
            fi
          done
          echo "verify-summary passed: all parallel lanes succeeded."
