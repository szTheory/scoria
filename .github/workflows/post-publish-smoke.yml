# Reusable post-publish registry attest SSOT.
# Blocking attest is wired via workflow_call from release-please.yml (post-publish-attest)
# and hex-publish.yml after publish-hex. The release:published trigger is intentionally
# removed — it races ahead of publish-hex in the release chain (D-77).

name: Post Publish Smoke

on:
  workflow_call:
    inputs:
      version:
        description: 'Semver without v prefix (e.g. 0.1.0)'
        required: true
        type: string
      skip_index_wait:
        description: 'Skip Hex index poll when chained after publish-hex'
        required: false
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      tag:
        description: 'Published tag (e.g. v0.1.0)'
        required: false
        type: string
      version:
        description: 'Semver without v prefix (e.g. 0.1.0)'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: post-publish-smoke-${{ github.event.inputs.tag || inputs.version || github.sha }}
  cancel-in-progress: false

jobs:
  smoke:
    name: Registry consumer attest
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: scoria_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d scoria_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      MIX_ENV: test
      SCORIA_DB_HOST: localhost
      SCORIA_DB_PORT: 5432
      SCORIA_DB_USERNAME: postgres
      SCORIA_DB_PASSWORD: postgres
      SCORIA_DB_NAME: scoria_test

    steps:
      - name: Resolve version
        id: version
        run: |
          set -euo pipefail
          raw="${{ inputs.version || github.event.inputs.version || github.event.inputs.tag || '' }}"
          raw="${raw#v}"
          if [ -z "$raw" ]; then
            echo "Could not resolve release version" >&2
            exit 1
          fi
          echo "version=${raw}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v6

      - uses: erlef/setup-beam@v1
        with:
          version-file: .tool-versions
          version-type: strict

      - name: Install Hex + Rebar
        run: |
          mix local.hex --force
          mix local.rebar --force

      - name: Wait for Hex.pm index
        if: inputs.skip_index_wait != true
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          for i in $(seq 1 36); do
            if curl -fsS "https://hex.pm/api/packages/scoria/releases/${VERSION}" | grep -q '"version"'; then
              echo "Hex.pm lists scoria ${VERSION}"
              exit 0
            fi
            echo "Waiting for Hex index... (${i}/36)"
            sleep 10
          done
          exit 1

      - name: Fetch deps and compile
        run: |
          mix deps.get
          mix compile --warnings-as-errors

      - name: Install phx_new archive for host consumer proof
        run: mix archive.install hex phx_new --force

      - name: Run post-publish registry attest
        env:
          SCORIA_REGISTRY_VERSION: ${{ steps.version.outputs.version }}
        run: mix scoria.post_publish_smoke

      - name: Summary
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          {
            echo "## Post-publish registry attest passed"
            echo "- Version: ${VERSION}"
            echo "- Fresh-install: deps.get → scoria.install → ecto.create → ecto.migrate → route + runtime overlay smokes"
            echo "- Conditional semver upgrade leg when version > 0.1.0"
          } >> "$GITHUB_STEP_SUMMARY"
