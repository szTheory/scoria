# Postgres (pgvector) for NATIVE host development only.
#
# Use this when you run the dev harness directly on the host (`mix phx.server` /
# `mix dev.setup` / `make dev`): host mix needs a PUBLISHED DB port, so this maps
# 5432 -> 55432 (a high, fleet-unlikely port to avoid the cross-project 5432
# clash). The fully-dockerized stack (compose.yml) uses its own UNPUBLISHED `db`
# service reached by name — do not run both against the same data.
#
# Start:  docker compose -f dev/pgvector-compose.yml up -d
# Point the host at it:  SCORIA_DB_PORT=55432 mix dev.setup
#
# Pinned to pg16 to match compose.yml's db (one pgvector version everywhere).
# No container_name: lets you run more than one checkout without a name clash.
services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: scoria_dev
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - ./pgvector-init.sql:/docker-entrypoint-initdb.d/01-scoria-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d scoria_dev"]
      interval: 5s
      timeout: 5s
      retries: 10
