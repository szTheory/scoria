services:
  postgres:
    image: pgvector/pgvector:pg14
    container_name: scoria-pgvector
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: scoria_dev
    ports:
      - "55432:5432"
    volumes:
      - ./pgvector-init.sql:/docker-entrypoint-initdb.d/01-scoria-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d scoria_dev"]
      interval: 5s
      timeout: 5s
      retries: 10
